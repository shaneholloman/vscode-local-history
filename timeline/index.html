<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src __CSP_SOURCE__; style-src __CSP_SOURCE__ 'unsafe-inline'; script-src __CSP_SOURCE__;">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="__STYLE_URI__">
    </head>

    <body class="cloak" data-breakpoint="__BREAKPOINT__" data-initial-unified="__INITIAL_UNIFIED__" data-line-height="__LINE_HEIGHT__" data-context-lines="__CONTEXT_LINES__">
        <div class="title-bar">
            <div class="nav-area">
                <button class="nav-btn" id="prevBtn" data-tooltip="Previous (older)"><span class="ico" style="mask-image:url('__PREV_NAV_ICON_URI__')"></span></button>
                <span class="counter" id="counter"></span>
                <button class="nav-btn" id="nextBtn" data-tooltip="Next (newer)"><span class="ico" style="mask-image:url('__NEXT_NAV_ICON_URI__')"></span></button>
            </div>
            <div class="zoom-controls" aria-label="Zoom controls">
                <button class="zoom-btn" id="zoomOutBtn" data-tooltip="Zoom out (Cmd/Ctrl -)">−</button>
                <button class="zoom-btn" id="zoomResetBtn" data-tooltip="Reset zoom">100%</button>
                <button class="zoom-btn" id="zoomInBtn" data-tooltip="Zoom in (Cmd/Ctrl +)">+</button>
            </div>
            <div style="align-items:center;display:flex;gap:6px">
                <button class="undo-btn" id="undoBtn" data-tooltip="Undo">↩</button>
                <!-- search area start -->
                <div class="search-area" id="searchArea">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search..." aria-label="Search">
                    <span class="search-counter" id="searchCounter">0/0</span>
                    <div>
                        <button class="search-btn" id="searchPrevBtn" data-tooltip="Previous match"><span class="ico" style="mask-image:url('__SEARCH_PREV_ICON_URI__')"></span></button>
                        <button class="search-btn" id="searchNextBtn" data-tooltip="Next match"><span class="ico" style="mask-image:url('__SEARCH_NEXT_ICON_URI__')"></span></button>
                        <button class="search-btn search-close-btn" id="searchCloseBtn" data-tooltip="Close search (Esc)"><span class="ico" style="mask-image:url('__SEARCH_CLOSE_ICON_URI__')"></span></button>
                    </div>
                </div>
                <!-- search area end -->
                <button class="view-toggle" id="viewToggle" data-tooltip="Switch to side-by-side mode">Unified</button>
                <button class="title-close-btn" id="closeBtn" data-tooltip="Close (Esc)"><span class="ico" style="mask-image:url('__CLOSE_ICON_URI__')"></span></button>
            </div>
        </div>

        <div class="timeline-strip" id="timelineStrip"></div>
        <div id="hoverTooltip" role="tooltip"></div>
        <div id="ctxMenu" role="menu">
            <button class="ctx-item" data-action="copy-line" role="menuitem">Copy line</button>
            <button class="ctx-item" data-action="copy-hunk" role="menuitem">Copy hunk</button>
        </div>

        <div class="diff-container loading" tabindex="-1">
            <div class="loading-indicator" role="status" aria-label="Loading"><span></span></div>
            <div class="misc-btns action-btns">
                <button class="scroll-top-btn" id="scrollTopBtn" data-tooltip="Scroll to top" aria-label="Scroll to top"><img src="__SCROLL_TOP_ICON_URI__" alt=""></button>
                <button class="pin-btn" id="pinBtn" data-tooltip="Pin lines" style="display:none"><span class="ico" style="mask-image:url('__PIN_ICON_URI__')"></span></button>
                <button class="pin-btn clear-pin-btn" id="clearPinBtn" data-tooltip="clear pin list" aria-label="clear pin list" style="display:none">×</button>
            </div>
            <div class="diff-pane" id="leftPane">
                <div class="diff-pane-body">
                    <div class="code-lines" id="leftLines"></div>
                    <div class="diff-actions action-btns">
                        <button class="restore-btn" id="restoreBtn" data-tooltip="Restore This Version" hidden>Restore This Version</button>
                        <button class="action-btn icon-btn" id="openFileBtn" data-tooltip="Open in Editor"><img src="__OPEN_FILE_ICON_URI__" alt=""></button>
                    </div>
                </div>
            </div>
            <div class="diff-pane" id="rightPane">
                <div class="diff-pane-body">
                    <div class="code-lines" id="rightLines"></div>
                </div>
            </div>
            <div class="unified-pane" id="unifiedPane">
                <div class="code-lines" id="unifiedLines"></div>
                <div class="diff-actions action-btns">
                    <button class="restore-btn" id="unifiedRestoreBtn" data-tooltip="Restore This Version" hidden>Restore This Version</button>
                    <button class="action-btn icon-btn" id="unifiedOpenFileBtn" data-tooltip="Open in Editor"><img src="__OPEN_FILE_ICON_URI__" alt=""></button>
                </div>
            </div>
        </div>

        <script type="module" src="__SCRIPT_URI__"></script>
    </body>
</html>
